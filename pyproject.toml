[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ohbs-core"
version = "0.2.0"
description = "One pip install for the whole ohbs-* family — ohbs-image + ohbs-host + ohbs-cloud + shared core"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "susunola"}]
requires-python = ">=3.9"
keywords = ["cis", "compliance", "security", "benchmark", "hardening", "terraform", "image"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "ohbs-image",
    "ohbs-host",
    "ohbs-cloud",
]

[project.urls]
Homepage = "https://github.com/susunola/cis-core"
Repository = "https://github.com/susunola/cis-core.git"
Issues = "https://github.com/susunola/cis-core/issues"

[tool.setuptools]
packages = ["cis_core"]

[tool.setuptools.dynamic]
version = {attr = "cis_core.VERSION"}
